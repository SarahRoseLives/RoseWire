name: Compile Workspace

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Build Go server
      - name: Build Go server
        run: |
          cd server
          go build -o ../rosewire-server

      # Copy config_example.json as config.json
      - name: Copy config_example.json to config.json
        run: |
          cp server/config_example.json config.json

      # Setup Flutter (latest stable with Dart >=3.8.1)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Upgrade Flutter & Dart
      - name: Upgrade Flutter
        run: |
          flutter upgrade

      # Confirm Dart version (for logging)
      - name: Show Dart version
        run: dart --version

      # Build Flutter APK
      - name: Build Flutter APK (Android)
        run: |
          cd rosewire
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../rosewire-client.apk

      # Build Flutter Linux
      - name: Build Flutter Desktop (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          cd rosewire
          flutter pub get
          flutter build linux --release
          cp build/linux/x64/release/bundle/rosewire ../rosewire-client

      # Upload rosewire-server
      - name: Upload rosewire-server
        uses: actions/upload-artifact@v4
        with:
          name: rosewire-server
          path: rosewire-server

      # Upload rosewire-client.apk
      - name: Upload rosewire-client.apk
        uses: actions/upload-artifact@v4
        with:
          name: rosewire-client.apk
          path: rosewire-client.apk

      # Upload rosewire-client (Linux)
      - name: Upload rosewire-client
        uses: actions/upload-artifact@v4
        with:
          name: rosewire-client
          path: rosewire-client

      # Upload config.json
      - name: Upload config.json
        uses: actions/upload-artifact@v4
        with:
          name: config.json
          path: config.json

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Copy config_example.json as config.json
      - name: Copy config_example.json to config.json
        run: |
          copy server\config_example.json config.json

      # Setup Flutter (latest stable with Dart >=3.8.1)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Upgrade Flutter & Dart
      - name: Upgrade Flutter
        run: |
          flutter upgrade

      # Confirm Dart version (for logging)
      - name: Show Dart version
        run: dart --version

      # Build Flutter Desktop (Windows)
      - name: Build Flutter Desktop (Windows)
        run: |
          cd rosewire
          flutter pub get
          flutter build windows --release
          copy build\windows\runner\Release\rosewire.exe ..\rosewire-client.exe

      # Upload rosewire-client.exe
      - name: Upload rosewire-client.exe
        uses: actions/upload-artifact@v4
        with:
          name: rosewire-client.exe
          path: rosewire-client.exe

      # Upload config.json
      - name: Upload config.json
        uses: actions/upload-artifact@v4
        with:
          name: config.json
          path: config.json